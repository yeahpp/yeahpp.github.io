<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>중국어 단어 퀴즈</title>
<style>
  /* ---------- 색상 (밝은 화면 / 어두운 화면) ---------- */
  :root {
    --paper: #f7f5ee;      /* 배경: 노트 종이 색 */
    --card: #ffffff;
    --ink: #1f2933;        /* 기본 글자 */
    --muted: #6b7480;      /* 흐린 글자 */
    --rule: #1d6f8c;       /* 노트 줄 파란색 */
    --rule-soft: #d5e6ed;
    --ok: #1b7f52;
    --ok-bg: #e4f4ea;
    --no: #c0392b;         /* 빨간 펜 */
    --no-bg: #fbe8e5;
    --warn: #8a5a00;       /* 사전 확인 "보충" 표시 */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #14181c;
      --card: #1c2227;
      --ink: #e9e6de;
      --muted: #98a2ad;
      --rule: #63b3d1;
      --rule-soft: #2b3840;
      --ok: #5fcf98;
      --ok-bg: #173326;
      --no: #f08a7e;
      --no-bg: #3a1f1c;
      --warn: #e3b341;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    line-height: 1.5;
    word-break: keep-all;   /* 한글이 단어 중간에서 끊기지 않게 */
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }

  /* ---------- 상단 ---------- */
  .titlebar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-size: 20px; letter-spacing: -0.01em; }
  .count { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .rule { height: 5px; margin: 10px 0 14px; border-top: 2px solid var(--rule); border-bottom: 1px solid var(--rule); }

  .guide-link { display: block; margin-bottom: 12px; font-size: 14px; color: var(--rule); text-decoration: none; }
  .guide-link:hover { text-decoration: underline; }
  .guide-link:focus-visible { outline: 2px solid var(--rule); outline-offset: 2px; }
  .sets { margin-bottom: 10px; }
  .seg .n { opacity: 0.7; font-weight: 400; margin-left: 4px; font-variant-numeric: tabular-nums; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
  .seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
  .seg button {
    font: inherit; font-size: 14px; padding: 8px 14px; min-height: 40px;
    border: 0; background: transparent; color: var(--rule); cursor: pointer;
  }
  .seg button.on { background: var(--rule); color: var(--paper); font-weight: 600; }
  .check { font-size: 14px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .check input { width: 16px; height: 16px; accent-color: var(--rule); }

  .bar { height: 3px; margin-top: 14px; background: var(--rule-soft); border-radius: 2px; overflow: hidden; }
  .bar-fill { height: 100%; width: 0; background: var(--rule); transition: width 0.25s ease; }

  /* ---------- 문제 카드 ---------- */
  .card {
    margin-top: 18px; padding: 24px 18px 20px;
    background: var(--card); border: 1px solid var(--rule-soft); border-radius: 12px;
  }
  .q-label { font-size: 13px; color: var(--muted); text-align: center; }
  .q-main { text-align: center; margin: 6px 0 2px; overflow-wrap: anywhere; }
  .q-main.hanzi {
    font-family: "Songti SC", "Noto Serif CJK SC", "Noto Serif SC", "SimSun", serif;
    font-size: clamp(40px, 12vw, 64px); line-height: 1.25;
  }
  .q-main.meaning { font-size: 24px; font-weight: 600; padding: 12px 0; text-wrap: balance; }
  .q-pinyin { text-align: center; color: var(--rule); font-size: 17px; min-height: 26px; visibility: hidden; }
  .show-pinyin .q-pinyin, .answered .q-pinyin { visibility: visible; }

  .choices { display: grid; gap: 10px; margin-top: 16px; }
  .choice {
    display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px;
    padding: 10px 14px; text-align: left; font: inherit; font-size: 16px; color: var(--ink);
    background: var(--card); border: 1.5px solid var(--rule-soft); border-radius: 10px; cursor: pointer;
  }
  .choice:hover:not(:disabled) { border-color: var(--rule); }
  .choice:disabled { cursor: default; color: var(--muted); }
  .choice .num {
    flex: none; width: 24px; height: 24px; border-radius: 50%;
    display: grid; place-items: center; font-size: 13px;
    border: 1px solid var(--rule-soft); color: var(--muted);
  }
  .choice .txt { flex: 1; overflow-wrap: anywhere; }
  .choice .txt.hanzi { font-family: "Songti SC", "Noto Serif CJK SC", "Noto Serif SC", "SimSun", serif; font-size: 24px; }
  .choice .c-pinyin { display: none; font-size: 13px; color: var(--muted); }
  .show-pinyin .c-pinyin, .answered .c-pinyin { display: block; }
  .choice .mark { flex: none; font-weight: 700; }

  .choice.correct { border-color: var(--ok); background: var(--ok-bg); color: var(--ink); }
  .choice.correct .mark { color: var(--ok); }
  .choice.wrong { border-color: var(--no); background: var(--no-bg); color: var(--ink); }
  .choice.wrong .mark { color: var(--no); }

  /* ---------- 정답 해설 ---------- */
  .feedback { margin-top: 16px; padding: 14px 16px; border-radius: 10px; border-left: 4px solid; }
  .feedback.ok { border-color: var(--ok); background: var(--ok-bg); }
  .feedback.no { border-color: var(--no); background: var(--no-bg); }
  .fb-head { font-weight: 700; font-size: 15px; }
  .feedback.ok .fb-head { color: var(--ok); }
  .feedback.no .fb-head { color: var(--no); }
  .fb-answer { margin-top: 6px; font-size: 16px; }
  .fb-answer .hz { font-family: "Songti SC", "Noto Serif CJK SC", "Noto Serif SC", "SimSun", serif; font-size: 22px; margin-right: 8px; }
  .fb-answer .py { color: var(--rule); margin-right: 8px; }
  .fb-note { margin-top: 6px; font-size: 14px; color: var(--muted); }
  .fb-dict { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--muted); font-size: 14px; }
  .fb-dict .badge {
    display: inline-block; margin-right: 6px; padding: 0 8px; border: 1px solid currentColor;
    border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap;
  }
  .fb-dict .badge.ok { color: var(--ok); }
  .fb-dict .badge.add { color: var(--warn); }
  .fb-dict .badge.na { color: var(--muted); }
  .fb-dict .src { margin-right: 6px; color: var(--muted); }
  .foot { margin-top: 20px; text-align: center; font-size: 12px; color: var(--muted); }

  .btn {
    display: block; width: 100%; min-height: 50px; margin-top: 14px;
    font: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
    color: var(--paper); background: var(--rule); border: 0; border-radius: 10px;
  }
  .btn.ghost { color: var(--rule); background: transparent; border: 1.5px solid var(--rule); }
  .hint-keys { margin-top: 10px; text-align: center; font-size: 12px; color: var(--muted); }
  @media (hover: none) { .hint-keys { display: none; } }

  button:focus-visible, input:focus-visible { outline: 2px solid var(--rule); outline-offset: 2px; }

  /* ---------- 결과 화면 ---------- */
  .result-score { text-align: center; font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .result-sub { text-align: center; color: var(--muted); margin-bottom: 8px; }
  .wrong-title { margin: 20px 0 4px; font-size: 14px; font-weight: 700; color: var(--no); }
  .wrong-list { list-style: none; margin: 0; padding: 0; }
  .wrong-list li { padding: 10px 0; border-bottom: 1px solid var(--rule-soft); }
  .wrong-list .hz { font-family: "Songti SC", "Noto Serif CJK SC", "Noto Serif SC", "SimSun", serif; font-size: 22px; margin-right: 8px; }
  .wrong-list .py { color: var(--rule); font-size: 14px; }
  .wrong-list .mn { display: block; font-size: 15px; }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div class="titlebar">
      <h1>중국어 단어 퀴즈</h1>
      <span class="count" id="count"></span>
    </div>
    <div class="rule"></div>
    <a class="guide-link" href="guide.html">세미모고반 1강 해설·모범답안 보기 →</a>
    <div class="sets">
      <div class="seg" id="setSeg" role="group" aria-label="단어장"></div>
    </div>
    <div class="controls">
      <div class="seg" id="modeSeg" role="group" aria-label="문제 유형">
        <button type="button" data-mode="toMeaning" class="on">한자 → 뜻</button>
        <button type="button" data-mode="toHanzi">뜻 → 한자</button>
      </div>
      <label class="check"><input type="checkbox" id="pinyinHint"> 병음 미리 보기</label>
    </div>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
  </header>

  <section id="stage" aria-live="polite"></section>
  <footer class="foot">사전 확인 출처: 汉典(zdic.net) · CC-CEDICT(mdbg.net)</footer>
</main>

<script>
/* =====================================================================
   1. 단어 목록  ← 단어를 추가/수정하려면 여기만 고치면 됩니다.

   단어장이 두 개 있습니다.
     NOTE_WORDS : 수업 노트 단어
     LIT_WORDS  : 중국문학 어휘
   새 단어장을 만들려면 같은 모양으로 목록을 하나 더 만들고,
   아래쪽 SETS 에 한 줄 추가하면 됩니다.

   한 줄이 단어 하나입니다.
     hanzi   : 한자
     pinyin  : 병음
     meaning : 뜻
     note    : (선택) 정답을 본 뒤에 같이 보여 줄 메모
     group   : (선택) 뜻이 비슷한 단어끼리 같은 이름을 붙여 두면,
               서로의 보기(오답)로 나오지 않습니다.
   ===================================================================== */
// ----- 단어장 1: 수업 노트 -----
const NOTE_WORDS = [
  { hanzi: "碰撞",       pinyin: "pèngzhuàng",        meaning: "충돌하다" },
  { hanzi: "手势",       pinyin: "shǒushì",           meaning: "손동작" },
  { hanzi: "操练",       pinyin: "cāoliàn",           meaning: "훈련하다, 연습하다" },
  { hanzi: "选址",       pinyin: "xuǎnzhǐ",           meaning: "장소를 선택하다" },
  { hanzi: "有的是",     pinyin: "yǒudeshì",          meaning: "숱하게 많다" },
  { hanzi: "威化饼",     pinyin: "wēihuàbǐng",        meaning: "웨하스" },
  { hanzi: "补给",       pinyin: "bǔjǐ",              meaning: "보급하다" },
  { hanzi: "踩雷",       pinyin: "cǎiléi",            meaning: "지뢰를 밟다", note: "잘못 골라서 낭패를 볼 때도 씁니다 (种草의 반대 느낌)." },
  { hanzi: "种草",       pinyin: "zhòngcǎo",          meaning: "좋은 물건이나 장소를 추천하다", group: "추천" },
  { hanzi: "种草帖",     pinyin: "zhòngcǎotiě",       meaning: "좋은 물건을 추천하는 글", group: "추천" },
  { hanzi: "安利",       pinyin: "ānlì",              meaning: "추천하다", group: "추천" },
  { hanzi: "红红火火",   pinyin: "hónghónghuǒhuǒ",    meaning: "(인기가) 들끓다, 왕성하다", group: "인기" },
  { hanzi: "黑料",       pinyin: "hēiliào",           meaning: "흑역사, 스캔들" },
  { hanzi: "红得发紫",   pinyin: "hóng de fā zǐ",     meaning: "지나치게 유명해지다", note: "풍자의 의미가 있습니다.", group: "인기" },
  { hanzi: "时代的洪流", pinyin: "shídài de hóngliú", meaning: "시대의 거센 흐름", note: "예) 陷入时代的洪流 / 一股洪流" },
  { hanzi: "不可阻挡",   pinyin: "bùkě zǔdǎng",       meaning: "막을 수 없다" },
  { hanzi: "攻坚战",     pinyin: "gōngjiānzhàn",      meaning: "계속 공격해야 하는 힘든 싸움", note: "예) 一场攻坚战" },
  { hanzi: "含着金汤匙", pinyin: "hánzhe jīn tāngchí", meaning: "금수저를 물고 태어나다" },
  { hanzi: "铁饭碗",     pinyin: "tiěfànwǎn",         meaning: "철밥통", group: "밥통" },
  { hanzi: "金饭碗",     pinyin: "jīnfànwǎn",         meaning: "금밥통 (대우 좋은 안정된 직장)", group: "밥통" },
  { hanzi: "捧",         pinyin: "pěng",              meaning: "받들다" },
  { hanzi: "山清水秀",   pinyin: "shānqīng shuǐxiù",  meaning: "산 좋고 물 맑다", group: "경치" },
  { hanzi: "绿水青山",   pinyin: "lǜshuǐ qīngshān",   meaning: "푸른 물과 푸른 산", group: "경치" },
  { hanzi: "怀念",       pinyin: "huáiniàn",          meaning: "그리워하다 (다신 돌아오지 못하는 것을)", note: "예) 怀念我们一起学习的时光。 / 怀念祖国", group: "그리움" },
  { hanzi: "思念",       pinyin: "sīniàn",            meaning: "그리워하다", note: "怀念 대신 쓸 수 있는 말: 思念, 想念", group: "그리움" },
  { hanzi: "想念",       pinyin: "xiǎngniàn",         meaning: "그립다", note: "怀念 대신 쓸 수 있는 말: 思念, 想念", group: "그리움" },
  { hanzi: "内心不安",   pinyin: "nèixīn bù'ān",      meaning: "마음이 불안하다", note: "관련 단어: 担忧, 忧虑, 焦虑", group: "걱정" },
  { hanzi: "担忧",       pinyin: "dānyōu",            meaning: "걱정하다", note: "内心不安을 나타내는 단어", group: "걱정" },
  { hanzi: "忧虑",       pinyin: "yōulǜ",             meaning: "우려하다, 근심하다", note: "内心不安을 나타내는 단어", group: "걱정" },
  { hanzi: "焦虑",       pinyin: "jiāolǜ",            meaning: "초조해하다", note: "内心不安을 나타내는 단어", group: "걱정" },
  { hanzi: "懊悔",       pinyin: "àohuǐ",             meaning: "후회하다", group: "후회" },
  { hanzi: "懊恼",       pinyin: "àonǎo",             meaning: "번뇌하다", group: "후회" },
  { hanzi: "子孙后代",   pinyin: "zǐsūn hòudài",      meaning: "후대" },
  { hanzi: "埋葬",       pinyin: "máizàng",           meaning: "묻다, 매장하다" },
  { hanzi: "扫墓",       pinyin: "sǎomù",             meaning: "성묘하다" },
  { hanzi: "上头",       pinyin: "shàngtóu",          meaning: "취기가 돌다, 중독되다" },
  { hanzi: "漫山遍野",   pinyin: "mànshānbiànyě",     meaning: "온 산천에 가득하다" },
];

// ----- 단어장 2: 중국문학 어휘 -----
const LIT_WORDS = [
  // 동작·행동 표현
  { hanzi: "派上用场",   pinyin: "pài shàng yòngchǎng", meaning: "실제로 쓰이다, 쓸모가 있다", note: "예) 这东西终于派上用场了。 이 물건이 드디어 요긴하게 쓰였다. (上: 결과·도달)" },
  { hanzi: "缩成一团",   pinyin: "suō chéng yì tuán",   meaning: "몸을 잔뜩 웅크리다", note: "예) 他缩成一团。 그는 몸을 잔뜩 웅크렸다. (成: 결과보어)" },
  { hanzi: "迈出脚步",   pinyin: "mài chū jiǎobù",      meaning: "발걸음을 내딛다", note: "예) 他终于迈出了脚步。 그는 마침내 발걸음을 내디뎠다. (出: 방향·결과)", group: "迈" },
  { hanzi: "迈",         pinyin: "mài",                 meaning: "발을 내딛다, 걸음을 옮기다", group: "迈" },
  { hanzi: "抱起胳膊",   pinyin: "bào qǐ gēbo",         meaning: "팔을 들어 모으다, 팔짱을 끼듯 하다" },
  { hanzi: "乱摸",       pinyin: "luàn mō",             meaning: "함부로 만지다, 마구 만지다" },
  { hanzi: "追查",       pinyin: "zhuīchá",             meaning: "추적하여 조사하다, 끝까지 캐다", group: "살피다" },
  { hanzi: "打量",       pinyin: "dǎliang",             meaning: "유심히 살펴보다, 훑어보다", note: "예) 他上下打量着我。 그는 나를 위아래로 훑어보았다.", group: "살피다" },
  { hanzi: "上门",       pinyin: "shàngmén",            meaning: "직접 찾아오다, 방문하다", note: "예) 好久没有客人上门了。 오랫동안 찾아오는 손님이 없었다." },
  { hanzi: "安了投递口", pinyin: "ān le tóudìkǒu",      meaning: "우편물 투입구를 설치했다", group: "投递口" },
  { hanzi: "紧闭",       pinyin: "jǐn bì",              meaning: "굳게 닫다, 꽉 닫혀 있다" },
  { hanzi: "荒废",       pinyin: "huāngfèi",            meaning: "방치하다, 황폐해지다, 소홀히 하다", note: "예) 房子荒废了。 집이 방치되어 황폐해졌다." },

  // 상태·모양·풍경 묘사
  { hanzi: "身躯",       pinyin: "shēnqū",              meaning: "몸, 육신, 체구" },
  { hanzi: "恋恋不舍",   pinyin: "liàn liàn bù shě",    meaning: "아쉬워하며 차마 떠나지 못하다" },
  { hanzi: "一旁",       pinyin: "yī páng",             meaning: "한쪽에, 곁에" },
  { hanzi: "鳞次栉比",   pinyin: "lín cì zhì bǐ",       meaning: "빽빽하게 줄지어 있다, 즐비하다" },
  { hanzi: "造型相似",   pinyin: "zàoxíng xiāngsì",     meaning: "외형이나 모양이 비슷하다" },
  { hanzi: "矗立",       pinyin: "chùlì",               meaning: "우뚝 서 있다, 높이 솟아 있다" },
  { hanzi: "平缓",       pinyin: "pínghuǎn",            meaning: "완만하다, 차분하다", note: "예) 平缓的坡道愈来愈陡。 완만하던 비탈길이 점점 더 가팔라졌다.", group: "비탈" },
  { hanzi: "坡道",       pinyin: "pōdào",               meaning: "비탈길, 경사로", note: "예) 平缓的坡道愈来愈陡。 완만하던 비탈길이 점점 더 가팔라졌다.", group: "비탈" },

/* =====================================================================
   3. 도구 함수
   ===================================================================== */
// 배열을 무작위로 섞은 새 배열을 돌려줍니다.
function shuffle(list) {
  const arr = list.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// 지금 고른 단어장의 단어들을 돌려줍니다.
function activeWords() {
  return SETS.find(s => s.id === setId).words;
}

// HTML 요소를 간단히 만드는 함수: el("div", "클래스이름", "글자")
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

// 정답 1개 + 오답 3개를 골라 섞습니다. 뜻이 비슷한(group이 같은) 단어는 오답에서 뺍니다.
function makeChoices(word) {
  const pool = activeWords().filter(w => w !== word && !(word.group && w.group === word.group));
  const picked = [];
  const usedGroups = new Set();
  for (const w of shuffle(pool)) {
    if (w.group && usedGroups.has(w.group)) continue;
    if (w.group) usedGroups.add(w.group);
    picked.push(w);
    if (picked.length === CHOICE_COUNT - 1) break;
  }
  return shuffle([word, ...picked]);
}

function updateHeader() {
  const done = pos + (answered ? 1 : 0);
  countEl.textContent = queue.length ? `${Math.min(pos + 1, queue.length)} / ${queue.length} · 정답 ${score}` : "";
  barFill.style.width = queue.length ? `${(done / queue.length) * 100}%` : "0";
}

   ===================================================================== */
function start(list) {
  queue = shuffle(list);
  pos = 0;
  score = 0;
  wrong = [];
  showQuestion();
}

function showQuestion() {
  answered = false;
  current = queue[pos];
  stage.classList.remove("answered");
  stage.replaceChildren();

  const card = el("div", "card");

  // 문제
  if (mode === "toMeaning") {
    card.append(el("div", "q-label", "이 단어의 뜻은?"));
    card.append(el("div", "q-main hanzi", current.hanzi));
    card.append(el("div", "q-pinyin", current.pinyin));
  } else {
    card.append(el("div", "q-label", "이 뜻에 맞는 단어는?"));
    card.append(el("div", "q-main meaning", current.meaning));
  }

  // 보기
  const list = el("div", "choices");
  choiceButtons = [];
  makeChoices(current).forEach((word, i) => {
    const btn = el("button", "choice");
    btn.type = "button";
    btn.append(el("span", "num", String(i + 1)));

    const txt = el("span", mode === "toHanzi" ? "txt hanzi" : "txt");
    txt.textContent = mode === "toHanzi" ? word.hanzi : word.meaning;
    if (mode === "toHanzi") txt.append(el("span", "c-pinyin", word.pinyin));
    btn.append(txt);

    btn.append(el("span", "mark"));
    btn.addEventListener("click", () => answer(word, btn));
    btn.word = word;
    choiceButtons.push(btn);
    list.append(btn);
  });
  card.append(list);
  card.append(el("div", "hint-keys", "키보드: 1~4 선택 · Enter 다음 문제"));

  stage.append(card);
  updateHeader();
}

// 보기를 눌렀을 때: 바로 정답을 표시합니다.
function answer(chosen, chosenBtn) {
  if (answered) return;
  answered = true;
  stage.classList.add("answered");

  const isCorrect = chosen === current;
  if (isCorrect) score++;
  else wrong.push(current);

  // 정답 보기는 초록색, 내가 고른 오답은 빨간색
  choiceButtons.forEach(btn => {
    btn.disabled = true;
    if (btn.word === current) {
      btn.classList.add("correct");
      btn.querySelector(".mark").textContent = "정답";
    }
  });
  if (!isCorrect) {
    chosenBtn.classList.add("wrong");
    chosenBtn.querySelector(".mark").textContent = "오답";
  }

  // 정답 해설
  const card = stage.querySelector(".card");
  card.querySelector(".hint-keys").remove();

  const fb = el("div", "feedback " + (isCorrect ? "ok" : "no"));
  fb.append(el("div", "fb-head", isCorrect ? "정답입니다" : "틀렸어요. 정답은 아래와 같아요"));
  const line = el("div", "fb-answer");
  line.append(el("span", "hz", current.hanzi), el("span", "py", current.pinyin), el("span", "mn", current.meaning));
  fb.append(line);
  if (current.note) fb.append(el("div", "fb-note", current.note));

  // 사전 확인 결과 (있으면 뜻 아래에 보여 줍니다)
  const check = DICT_CHECK[current.hanzi];
  if (check) {
    const [verdict, source, text] = check;
    const kind = verdict === "일치" ? "ok" : verdict === "보충" ? "add" : "na";
    const row = el("div", "fb-dict");
    row.append(el("span", "badge " + kind, "사전 확인 · " + verdict));
    if (source) row.append(el("span", "src", source));
    row.append(el("span", "", text));
    fb.append(row);
  }
  card.append(fb);

  const isLast = pos === queue.length - 1;
  const nextBtn = el("button", "btn", isLast ? "결과 보기" : "다음 문제");
  nextBtn.type = "button";
  nextBtn.addEventListener("click", next);
  card.append(nextBtn);

  updateHeader();
}

function next() {
  if (!answered) return;
  pos++;
  if (pos < queue.length) showQuestion();
  else showResult();
}

function showResult() {
  current = null;
  answered = false;
  stage.classList.remove("answered");
  stage.replaceChildren();

  const card = el("div", "card");
  card.append(el("div", "result-score", `${score} / ${queue.length}`));
  card.append(el("div", "result-sub", wrong.length === 0 ? "전부 맞혔어요" : `틀린 단어 ${wrong.length}개`));

  if (wrong.length > 0) {
    card.append(el("div", "wrong-title", "틀린 단어"));
    const ul = el("ul", "wrong-list");
    wrong.forEach(w => {
      const li = el("li");
      li.append(el("span", "hz", w.hanzi), el("span", "py", w.pinyin), el("span", "mn", w.meaning));
      ul.append(li);
    });
    card.append(ul);

    const retry = el("button", "btn", "틀린 단어만 다시 풀기");
    retry.type = "button";
    const retryList = wrong.slice();
    retry.addEventListener("click", () => start(retryList));
    card.append(retry);
  }

  const again = el("button", wrong.length > 0 ? "btn ghost" : "btn", "전체 다시 풀기");
  again.type = "button";
  again.addEventListener("click", () => start(activeWords()));
  card.append(again);

  stage.append(card);
  countEl.textContent = `완료 · 정답 ${score}`;
  barFill.style.width = "100%";
}

/* =====================================================================
   5. 버튼·키보드 연결
   ===================================================================== */
// 단어장 고르기 버튼 만들기 (바꾸면 처음부터 다시 시작)
const setSeg = document.getElementById("setSeg");
SETS.forEach(set => {
  const btn = el("button", set.id === setId ? "on" : "", set.name);
  btn.type = "button";
  btn.append(el("span", "n", String(set.words.length)));
  btn.addEventListener("click", () => {
    if (set.id === setId) return;
    setId = set.id;
    setSeg.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === btn));
    start(activeWords());
  });
  setSeg.append(btn);
});

// 문제 유형 바꾸기 (바꾸면 처음부터 다시 시작)
document.querySelectorAll("#modeSeg button").forEach(btn => {
  btn.addEventListener("click", () => {
    if (btn.dataset.mode === mode) return;
    mode = btn.dataset.mode;
    document.querySelectorAll("#modeSeg button").forEach(b => b.classList.toggle("on", b === btn));
    start(activeWords());
  });
});

// 병음 미리 보기 켜고 끄기
document.getElementById("pinyinHint").addEventListener("change", e => {
  stage.classList.toggle("show-pinyin", e.target.checked);
});

// 키보드: 1~4로 보기 선택, Enter/스페이스로 다음 문제
document.addEventListener("keydown", e => {
  if (!current) return;
  if (!answered) {
    const n = Number(e.key);
    if (n >= 1 && n <= choiceButtons.length) choiceButtons[n - 1].click();
  } else if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    next();
  }
});

start(activeWords());
</script>
